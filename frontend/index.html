<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DualMind | AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-spinner">
        <div class="spinner"></div>
        <p>Processing...</p>
    </div>
</div>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-page">
    <div class="login-card">
        <div class="login-icon"><i class="fas fa-brain"></i></div>
        <h1>DualMind</h1>
        <p class="login-sub">AI Assistant with Document Search</p>
        
        <div id="loginForm" class="login-form active">
            <input type="email" id="loginEmail" placeholder="Email" class="login-input">
            <input type="password" id="loginPassword" placeholder="Password" class="login-input">
            <button id="loginBtn" class="login-btn">Sign In</button>
            <p class="login-switch">New user? <a href="#" id="showRegister">Create account</a></p>
        </div>
        
        <div id="registerForm" class="login-form">
            <input type="text" id="registerName" placeholder="Full name" class="login-input">
            <input type="email" id="registerEmail" placeholder="Email" class="login-input">
            <input type="password" id="registerPassword" placeholder="Password (min 6)" class="login-input">
            <button id="registerBtn" class="login-btn">Create Account</button>
            <p class="login-switch">Already have an account? <a href="#" id="showLogin">Sign in</a></p>
        </div>
    </div>
</div>

<!-- CHAT PAGE -->
<div id="chatPage" class="chat-page hidden">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header">
            <button id="newChatBtn" class="new-chat-btn"><i class="fas fa-plus"></i> New chat</button>
        </div>
        <div id="sessionList" class="session-list"></div>
        <div class="sidebar-footer">
            <div class="user-row"><i class="fas fa-user-circle"></i> <span id="userEmailSidebar"></span></div>
            <button id="logoutSidebarBtn" class="logout-sidebar"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <!-- MAIN CHAT -->
    <div class="main-chat">
        <div class="chat-header">
            <div class="title-area">
                <h3 id="chatTitle">New conversation</h3>
                <button id="renameChatBtn" class="rename-btn"><i class="fas fa-pen"></i></button>
            </div>
            <div class="search-modes">
                <button class="mode-btn" data-mode="closed"><i class="fas fa-folder"></i> Documents</button>
                <button class="mode-btn" data-mode="open"><i class="fas fa-globe"></i> Web</button>
                <button class="mode-btn active" data-mode="hybrid"><i class="fas fa-link"></i> Hybrid</button>
            </div>
        </div>

        <div id="messagesContainer" class="messages-container">
            <div class="welcome">
                <i class="fas fa-brain"></i>
                <h3>How can I help?</h3>
                <p>Upload PDFs or ask anything</p>
            </div>
        </div>

        <div class="input-section">
            <div class="attach-row">
                <button id="attachPdfBtn" class="attach-btn"><i class="fas fa-paperclip"></i> Attach PDF</button>
                <input type="file" id="pdfFileInput" accept=".pdf" hidden>
                <div id="fileBadge" class="file-badge hidden"></div>
            </div>
            <div class="input-row">
                <textarea id="messageInput" placeholder="Ask a question..." rows="1"></textarea>
                <button id="sendMsgBtn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
            <div class="input-hint">DualMind searches your documents and the web</div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
