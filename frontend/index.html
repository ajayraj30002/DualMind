<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DualMind | AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/lib/marked.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-highlight@2.1.1/lib/index.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-spinner">
        <div class="spinner"></div>
        <p>DualMind is waking up...</p>
    </div>
</div>

<div id="loginPage" class="login-page">
    <div class="login-card">
        <div class="login-icon"><i class="fas fa-brain"></i></div>
        <h1>DualMind</h1>
        <p class="login-sub">AI Assistant with Document Search & Web Intelligence</p>
        <div id="loginForm" class="login-form active">
            <input type="email" id="loginEmail" placeholder="Email" class="login-input">
            <input type="password" id="loginPassword" placeholder="Password" class="login-input">
            <button id="loginBtn" class="login-btn">Sign In</button>
            <p class="login-switch">New user? <a href="#" id="showRegister">Create account</a></p>
        </div>
        <div id="registerForm" class="login-form">
            <input type="text" id="registerName" placeholder="Full name" class="login-input">
            <input type="email" id="registerEmail" placeholder="Email" class="login-input">
            <input type="password" id="registerPassword" placeholder="Password (min 6)" class="login-input">
            <button id="registerBtn" class="login-btn">Create Account</button>
            <p class="login-switch">Already have an account? <a href="#" id="showLogin">Sign in</a></p>
        </div>
    </div>
</div>

<div id="chatPage" class="chat-page hidden">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="sidebarToggle">
            <i class="fas fa-chevron-left"></i>
        </button>
        <div class="sidebar-header">
            <button id="newChatBtn" class="new-chat-btn">
                <i class="fas fa-plus"></i>
                <span>New chat</span>
            </button>
        </div>
        <div id="sessionList" class="session-list"></div>
        <div class="sidebar-footer">
            <div class="user-row">
                <i class="fas fa-user-circle"></i>
                <span id="userEmailSidebar"></span>
            </div>
            <button id="logoutSidebarBtn" class="logout-sidebar">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>
    
    <!-- Main Chat Area -->
    <div class="main-chat">
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-title" id="chatTitle">New conversation</div>
            <div class="chat-logo">
                <i class="fas fa-brain"></i>
                <span>DualMind</span>
            </div>
        </div>
        
        <!-- Messages -->
        <div id="messagesContainer" class="messages-container">
            <div class="welcome">
                <i class="fas fa-brain"></i>
                <h2>Ready when you are</h2>
                <p>Ask from your PDFs, the web, or both.</p>
            </div>
        </div>
        
        <!-- Input Area - DeepSeek Style -->
        <div class="input-area">
            <div class="input-card">
                <!-- Mode Toggle -->
                <div class="mode-toggle">
                    <button class="mode-option active" data-mode="hybrid">
                        <i class="fas fa-link"></i> Hybrid
                    </button>
                    <button class="mode-option" data-mode="open">
                        <i class="fas fa-globe"></i> Web
                    </button>
                </div>
                
                <!-- Text Input -->
                <div class="input-row">
                    <textarea id="messageInput" placeholder="Ask DualMind anything..." rows="1"></textarea>
                    <button id="sendMsgBtn" class="send-btn">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
                
                <!-- Bottom Bar -->
                <div class="input-footer">
                    <div class="attach-wrapper">
                        <button id="attachPdfBtn" class="attach-link">
                            <i class="fas fa-paperclip"></i>
                            <span>Attach PDF</span>
                        </button>
                        <input type="file" id="pdfFileInput" accept=".pdf" hidden>
                        <div id="fileBadge" class="file-badge hidden"></div>
                    </div>
                    <div class="input-hint">
                        <i class="fas fa-info-circle"></i> Press Enter to send
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
