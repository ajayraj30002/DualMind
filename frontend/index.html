<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DualMind | AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- CHANGED: Using dark theme instead of github-dark for better syntax colors -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: #000; color: #fff; height: 100vh; overflow: hidden; }

        /* Loader */
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .loading-overlay.hidden { display: none; }
        .loading-spinner { text-align: center; background: #1a1a1a; padding: 2rem 3rem; border-radius: 1rem; border: 1px solid #333; }
        .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #f97316; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-spinner p { color: #fff; font-size: 0.875rem; }

        /* Login Panels */
        .login-page { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: #000; z-index: 100; }
        .login-page.hidden { display: none; }
        .login-card { background: #111; padding: 2rem; border-radius: 1.5rem; width: 100%; max-width: 400px; text-align: center; border: 1px solid #222; }
        .login-icon i { font-size: 3rem; color: #f97316; }
        .login-card h1 { font-size: 1.5rem; margin-top: 0.5rem; background: linear-gradient(135deg, #fff, #f97316); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .login-sub { color: #888; font-size: 0.8rem; margin-bottom: 1.5rem; }
        .login-form { display: none; }
        .login-form.active { display: block; }
        .login-input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; background: #1a1a1a; border: 1px solid #333; border-radius: 0.5rem; color: #fff; font-size: 0.9rem; font-family: inherit; }
        .login-input:focus { outline: none; border-color: #f97316; }
        .login-btn { width: 100%; padding: 0.75rem; background: #f97316; border: none; border-radius: 0.5rem; color: #fff; font-weight: 600; cursor: pointer; font-family: inherit; }
        .login-btn:hover { background: #fb923c; }
        .login-switch { margin-top: 1rem; color: #666; font-size: 0.8rem; }
        .login-switch a { color: #f97316; text-decoration: none; }

        /* Shell Architecture */
        .chat-page { display: flex; height: 100vh; width: 100%; }
        .chat-page.hidden { display: none; }
        
        /* Sidebar with collapse */
        .sidebar { width: 260px; background: #111; border-right: 1px solid #222; display: flex; flex-direction: column; transition: width 0.3s ease, margin 0.3s ease; position: relative; }
        .sidebar.collapsed { width: 60px; }
        .sidebar.collapsed .sidebar-header span, 
        .sidebar.collapsed .session-title,
        .sidebar.collapsed .user-row span,
        .sidebar.collapsed .sidebar-footer .user-row i:not(.fa-bars),
        .sidebar.collapsed .new-chat-btn span { display: none; }
        .sidebar.collapsed .new-chat-btn { justify-content: center; padding: 0.75rem; }
        .sidebar.collapsed .session-item { justify-content: center; padding: 0.6rem; }
        .sidebar.collapsed .delete-session { display: none; }
        .sidebar.collapsed .sidebar-footer { justify-content: center; }
        
        .sidebar-toggle { position: absolute; right: -12px; top: 20px; background: #f97316; border: none; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; color: #fff; font-size: 12px; transition: transform 0.3s; }
        .sidebar-toggle:hover { background: #fb923c; transform: scale(1.1); }
        .sidebar.collapsed .sidebar-toggle { transform: rotate(180deg); }
        
        .sidebar-header { padding: 1rem; border-bottom: 1px solid #222; display: flex; justify-content: center; }
        .new-chat-btn { width: 100%; padding: 0.75rem; background: #f97316; border: none; border-radius: 0.5rem; color: #fff; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-family: inherit; }
        .new-chat-btn:hover { background: #fb923c; }
        .session-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .session-item { padding: 0.6rem 0.75rem; border-radius: 0.5rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #aaa; font-size: 0.85rem; margin-bottom: 2px; }
        .session-item:hover { background: #1a1a1a; color: #fff; }
        .session-item.active { background: #1a1a1a; color: #f97316; }
        .session-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .delete-session { background: none; border: none; color: #555; cursor: pointer; opacity: 0; padding: 0.2rem; }
        .session-item:hover .delete-session { opacity: 1; }
        .delete-session:hover { color: #f97316; }
        .sidebar-footer { padding: 1rem; border-top: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .user-row { display: flex; align-items: center; gap: 0.5rem; color: #aaa; font-size: 0.8rem; }
        .logout-sidebar { background: none; border: none; color: #555; cursor: pointer; padding: 0.5rem; }
        .logout-sidebar:hover { color: #f97316; }

        /* Main Chat */
        .main-chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .chat-header { padding: 0.75rem 1.5rem; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .title-area { display: flex; align-items: center; gap: 0.5rem; }
        .title-area h3 { font-weight: 500; font-size: 1rem; }
        .rename-btn { background: none; border: none; color: #666; cursor: pointer; padding: 0.25rem; }
        .rename-btn:hover { color: #f97316; }
        .search-modes { display: flex; gap: 0.25rem; background: #1a1a1a; padding: 0.2rem; border-radius: 0.5rem; }
        .mode-btn { padding: 0.3rem 0.8rem; background: none; border: none; border-radius: 0.4rem; color: #aaa; cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; gap: 0.3rem; font-family: inherit; }
        .mode-btn.active { background: #f97316; color: #fff; }
        .mode-btn:hover:not(.active) { background: #2a2a2a; color: #fff; }
        
        .messages-container { flex: 1; overflow-y: auto; padding: 1.5rem; }
        .welcome { text-align: center; padding: 3rem; color: #888; }
        .welcome i { font-size: 3rem; color: #f97316; margin-bottom: 1rem; }
        .welcome h3 { color: #fff; margin-bottom: 0.3rem; }

        /* Message Bubbles */
        .message { display: flex; gap: 0.8rem; margin-bottom: 1.5rem; max-width: 85%; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { flex-direction: row-reverse; margin-left: auto; }
        .message.assistant { margin-right: auto; }
        .message-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.8rem; }
        .message.user .message-avatar { background: #f97316; }
        .message.assistant .message-avatar { background: #1a1a1a; border: 1px solid #333; color: #f97316; }
        .message-content { background: #1a1a1a; padding: 0.75rem 1rem; border-radius: 1rem; font-size: 0.875rem; line-height: 1.6; word-wrap: break-word; max-width: 100%; border: 1px solid #2a2a2a; }
        .message.user .message-content { background: #f97316; border-color: #f97316; display: flex; flex-direction: column; align-items: flex-end; }

        /* Markdown Styles */
        .md-body { color: #e5e5e5; font-size: 0.875rem; line-height: 1.7; }
        .md-body h1, .md-body h2, .md-body h3, .md-body h4 { color: #ffffff; font-weight: 600; margin-top: 1.2rem; margin-bottom: 0.5rem; line-height: 1.3; }
        .md-body h1 { font-size: 1.15rem; border-bottom: 1px solid #2a2a2a; padding-bottom: 0.4rem; }
        .md-body h2 { font-size: 1rem; color: #f97316; }
        .md-body h3 { font-size: 0.9rem; color: #fb923c; }
        .md-body h4 { font-size: 0.85rem; color: #fdba74; }
        .md-body p { margin-bottom: 0.75rem; color: #d4d4d4; }
        .md-body ul { margin: 0.5rem 0 0.75rem 0; padding-left: 1.25rem; list-style: none; }
        .md-body ul li { position: relative; padding-left: 0.5rem; margin-bottom: 0.4rem; color: #d4d4d4; line-height: 1.6; }
        .md-body ul li::before { content: '▸'; position: absolute; left: -1rem; color: #f97316; font-size: 0.7rem; top: 0.15rem; }
        .md-body ol { margin: 0.5rem 0 0.75rem 0; padding-left: 1.5rem; }
        .md-body ol li { margin-bottom: 0.4rem; color: #d4d4d4; line-height: 1.6; }
        .md-body ol li::marker { color: #f97316; font-weight: 600; }
        .md-body strong { color: #ffffff; font-weight: 600; }
        .md-body em { color: #fdba74; font-style: italic; }
        
        /* Code Block with Copy Button */
        .code-wrapper { position: relative; margin: 0.75rem 0; }
        .code-wrapper pre { background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 0.6rem; padding: 1rem; overflow-x: auto; margin: 0; }
        .code-wrapper code { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; line-height: 1.6; }
        .copy-btn { position: absolute; top: 8px; right: 8px; background: #2a2a2a; border: 1px solid #444; border-radius: 0.4rem; padding: 4px 8px; color: #aaa; cursor: pointer; font-size: 0.7rem; display: flex; align-items: center; gap: 4px; transition: all 0.2s; font-family: inherit; }
        .copy-btn:hover { background: #f97316; color: #fff; border-color: #f97316; }
        .copy-btn.copied { background: #22c55e; color: #fff; border-color: #22c55e; }
        
        .md-body pre { background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 0.6rem; padding: 1rem; overflow-x: auto; margin: 0.75rem 0; position: relative; }
        .md-body pre code { background: none; border: none; padding: 0; font-size: 0.78rem; line-height: 1.6; display: block; }
        
        /* ========== NEW: ENHANCED SYNTAX HIGHLIGHTING COLORS ========== */
        /* DeepSeek-style vibrant token colors */
        .hljs-comment { color: #6a9955 !important; font-style: italic; }
        .hljs-keyword { color: #ff7b72 !important; font-weight: 500; }
        .hljs-built_in { color: #ff7b72 !important; }
        .hljs-literal { color: #79c0ff !important; }
        .hljs-number { color: #79c0ff !important; }
        .hljs-string { color: #a5d6ff !important; }
        .hljs-function { color: #d2a8ff !important; }
        .hljs-title { color: #d2a8ff !important; }
        .hljs-title.function_ { color: #d2a8ff !important; }
        .hljs-params { color: #e6edf3 !important; }
        .hljs-variable { color: #ffa657 !important; }
        .hljs-property { color: #79c0ff !important; }
        .hljs-attr { color: #79c0ff !important; }
        .hljs-tag { color: #ff7b72 !important; }
        .hljs-name { color: #ff7b72 !important; }
        .hljs-attribute { color: #79c0ff !important; }
        .hljs-selector-tag { color: #ff7b72 !important; }
        .hljs-selector-id { color: #79c0ff !important; }
        .hljs-selector-class { color: #79c0ff !important; }
        .hljs-selector-attr { color: #79c0ff !important; }
        .hljs-selector-pseudo { color: #79c0ff !important; }
        .hljs-template-tag { color: #ff7b72 !important; }
        .hljs-template-variable { color: #ffa657 !important; }
        .hljs-regexp { color: #a5d6ff !important; }
        .hljs-symbol { color: #ff7b72 !important; }
        .hljs-bullet { color: #79c0ff !important; }
        .hljs-link { color: #79c0ff !important; }
        .hljs-section { color: #d2a8ff !important; }
        .hljs-addition { color: #2ea043 !important; background: rgba(46, 160, 67, 0.1); display: inline-block; width: 100%; }
        .hljs-deletion { color: #f85149 !important; background: rgba(248, 81, 73, 0.1); display: inline-block; width: 100%; }
        .hljs-meta { color: #ff7b72 !important; }
        .hljs-meta-string { color: #a5d6ff !important; }
        
        /* ========== NEW: CODE EXPLANATION STYLING ========== */
        /* Subtle gray styling for explanations that follow code blocks */
        .code-wrapper + p,
        pre + p,
        .md-body pre + p {
            color: #9ca3af !important;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            padding-left: 0.75rem;
            border-left: 2px solid #f97316;
            font-style: normal;
            line-height: 1.5;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 0 0.5rem 0.5rem 0;
        }
        
        /* Selection color within code blocks */
        .code-wrapper pre code::selection,
        .md-body pre code::selection {
            background: rgba(249, 115, 22, 0.3);
        }
        
        .source-badge { display: inline-flex; align-items: center; gap: 0.3rem; margin-top: 0.6rem; padding: 0.2rem 0.6rem; background: rgba(249,115,22,0.1); border: 1px solid rgba(249,115,22,0.2); border-radius: 1rem; font-size: 0.68rem; color: #f97316; }
        .source-badge i { font-size: 0.6rem; }
        .message-doc-attachment { background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 16px; font-size: 0.7rem; margin-bottom: 6px; display: inline-flex; align-items: center; gap: 5px; color: #fff; font-weight: 500; }

        /* Input Section */
        .input-section { padding: 1rem 1.5rem 1.5rem; border-top: 1px solid #222; }
        .attach-row { margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        .attach-btn { padding: 0.3rem 0.8rem; background: #1a1a1a; border: 1px solid #333; border-radius: 0.5rem; color: #aaa; cursor: pointer; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s; font-family: inherit; }
        .attach-btn:hover { background: #2a2a2a; color: #fff; border-color: #f97316; }
        .file-badge { padding: 0.2rem 0.8rem; background: rgba(249,115,22,0.15); border-radius: 1rem; font-size: 0.7rem; color: #f97316; display: inline-flex; align-items: center; gap: 0.5rem; }
        .file-badge.hidden { display: none; }
        .input-row { display: flex; gap: 0.75rem; background: #1a1a1a; border-radius: 1rem; padding: 0.5rem 1rem; border: 1px solid #333; transition: border-color 0.2s; }
        .input-row:focus-within { border-color: #f97316; }
        #messageInput { flex: 1; background: none; border: none; color: #fff; font-family: inherit; font-size: 0.875rem; resize: none; padding: 0.4rem 0; line-height: 1.4; }
        #messageInput:focus { outline: none; }
        #messageInput::placeholder { color: #555; }
        .send-btn { background: #f97316; border: none; border-radius: 0.5rem; padding: 0.4rem; color: #fff; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; flex-shrink: 0; }
        .send-btn:hover:not(:disabled) { background: #fb923c; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .input-hint { text-align: center; font-size: 0.6rem; color: #555; margin-top: 0.5rem; }
        .loading-text { text-align: center; padding: 1rem; color: #666; font-size: 0.8rem; }

        .typing-dots { display: flex; gap: 4px; padding: 0.3rem; }
        .typing-dots span { width: 6px; height: 6px; background: #555; border-radius: 50%; animation: typing 1.4s infinite ease-in-out; }
        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.3; } 30% { transform: translateY(-7px); opacity: 1; } }
        .hidden { display: none !important; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
        
        @media (max-width: 768px) { .sidebar { width: 200px; } .sidebar.collapsed { width: 50px; } .message { max-width: 92%; } }
    </style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-spinner"><div class="spinner"></div><p>Processing...</p></div>
</div>

<div id="loginPage" class="login-page">
    <div class="login-card">
        <div class="login-icon"><i class="fas fa-brain"></i></div>
        <h1>DualMind</h1>
        <p class="login-sub">AI Assistant with Document Search</p>
        <div id="loginForm" class="login-form active">
            <input type="email" id="loginEmail" placeholder="Email" class="login-input">
            <input type="password" id="loginPassword" placeholder="Password" class="login-input">
            <button id="loginBtn" class="login-btn">Sign In</button>
            <p class="login-switch">New user? <a href="#" id="showRegister">Create account</a></p>
        </div>
        <div id="registerForm" class="login-form">
            <input type="text" id="registerName" placeholder="Full name" class="login-input">
            <input type="email" id="registerEmail" placeholder="Email" class="login-input">
            <input type="password" id="registerPassword" placeholder="Password (min 6)" class="login-input">
            <button id="registerBtn" class="login-btn">Create Account</button>
            <p class="login-switch">Already have an account? <a href="#" id="showLogin">Sign in</a></p>
        </div>
    </div>
</div>

<div id="chatPage" class="chat-page hidden">
    <div class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-chevron-left"></i></button>
        <div class="sidebar-header"><button id="newChatBtn" class="new-chat-btn"><i class="fas fa-plus"></i> <span>New chat</span></button></div>
        <div id="sessionList" class="session-list"></div>
        <div class="sidebar-footer"><div class="user-row"><i class="fas fa-user-circle"></i> <span id="userEmailSidebar"></span></div><button id="logoutSidebarBtn" class="logout-sidebar"><i class="fas fa-sign-out-alt"></i></button></div>
    </div>
    <div class="main-chat">
        <div class="chat-header">
            <div class="title-area"><h3 id="chatTitle">New conversation</h3><button id="renameChatBtn" class="rename-btn"><i class="fas fa-pen"></i></button></div>
            <div class="search-modes"><button class="mode-btn active" data-mode="hybrid"><i class="fas fa-link"></i> Hybrid</button><button class="mode-btn" data-mode="open"><i class="fas fa-globe"></i> Web</button></div>
        </div>
        <div id="messagesContainer" class="messages-container"><div class="welcome"><i class="fas fa-brain"></i><h3>Ready when you are</h3><p>Ask from your PDFs, the web, or both. Use Hybrid for the best experience.</p></div></div>
        <div class="input-section">
            <div class="attach-row"><button id="attachPdfBtn" class="attach-btn"><i class="fas fa-paperclip"></i> Attach PDF</button><input type="file" id="pdfFileInput" accept=".pdf" hidden><div id="fileBadge" class="file-badge hidden"></div></div>
            <div class="input-row"><textarea id="messageInput" placeholder="Ask a question..." rows="1"></textarea><button id="sendMsgBtn" class="send-btn"><i class="fas fa-paper-plane"></i></button></div>
            <div class="input-hint">Hybrid = PDF context + web search</div>
        </div>
    </div>
</div>

<script src="script.js?v=2"></script>
</body>
</html>
