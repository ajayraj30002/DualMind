<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DualMind | AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: #000; color: #fff; height: 100vh; overflow: hidden; }

        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .loading-overlay.hidden { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-spinner p { color: #fff; font-size: 0.875rem; }

        .login-page { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: #000; z-index: 100; }
        .login-page.hidden { display: none; }

        .login-icon i { font-size: 3rem; color: #f97316; }
        .login-card h1 { font-size: 1.5rem; margin-top: 0.5rem; background: linear-gradient(135deg, #fff, #f97316); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .login-sub { color: #888; font-size: 0.8rem; margin-bottom: 1.5rem; }
        .login-form { display: none; }
        .login-form.active { display: block; }
        .login-input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; background: #1a1a1a; border: 1px solid #333; border-radius: 0.5rem; color: #fff; font-size: 0.9rem; font-family: inherit; }
        .login-input:focus { outline: none; border-color: #f97316; }
        .login-btn { width: 100%; padding: 0.75rem; background: #f97316; border: none; border-radius: 0.5rem; color: #fff; font-weight: 600; cursor: pointer; font-family: inherit; }
        .login-btn:hover { background: #fb923c; }
        .login-switch { margin-top: 1rem; color: #666; font-size: 0.8rem; }
        .login-switch a { color: #f97316; text-decoration: none; }

        .chat-page { display: flex; height: 100vh; width: 100%; }
        .chat-page.hidden { display: none; }
        
        .sidebar { width: 260px; background: #111; border-right: 1px solid #222; display: flex; flex-direction: column; transition: width 0.3s ease; position: relative; }
        .sidebar.collapsed { width: 60px; }
        .sidebar.collapsed .sidebar-header span, .sidebar.collapsed .session-title, .sidebar.collapsed .user-row span, .sidebar.collapsed .new-chat-btn span { display: none; }
        .sidebar.collapsed .new-chat-btn { justify-content: center; padding: 0.75rem; }
        .sidebar.collapsed .session-item { justify-content: center; padding: 0.6rem; }
        .sidebar.collapsed .delete-session { display: none; }
        .sidebar.collapsed .sidebar-footer { justify-content: center; }
        
        .sidebar-toggle { position: absolute; right: -12px; top: 20px; background: #f97316; border: none; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; color: #fff; font-size: 12px; }
        .sidebar-toggle:hover { background: #fb923c; transform: scale(1.1); }
        .sidebar.collapsed .sidebar-toggle { transform: rotate(180deg); }
        
        .sidebar-header { padding: 1rem; border-bottom: 1px solid #222; display: flex; justify-content: center; }
        .new-chat-btn { width: 100%; padding: 0.75rem; background: #f97316; border: none; border-radius: 0.5rem; color: #fff; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-family: inherit; }
        .new-chat-btn:hover { background: #fb923c; }
        .session-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .session-item { padding: 0.6rem 0.75rem; border-radius: 0.5rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #aaa; font-size: 0.85rem; margin-bottom: 2px; }
        .session-item:hover { background: #1a1a1a; color: #fff; }
        .session-item.active { background: #1a1a1a; color: #f97316; }
        .session-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .sidebar-footer { padding: 1rem; border-top: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }

        .logout-sidebar { background: none; border: none; color: #555; cursor: pointer; padding: 0.5rem; }
        .logout-sidebar:hover { color: #f97316; }

        .main-chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { padding: 0.75rem 1.5rem; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .title-area { display: flex; align-items: center; gap: 0.5rem; }
        .title-area h3 { font-weight: 500; font-size: 1rem; }
        .rename-btn { background: none; border: none; color: #666; cursor: pointer; padding: 0.25rem; }

        .md-body h1, .md-body h2, .md-body h3, .md-body h4 { color: #ffffff; font-weight: 600; margin-top: 1.2rem; margin-bottom: 0.5rem; line-height: 1.3; }

        .md-body h2 { font-size: 1rem; color: #f97316; }
        .md-body h3 { font-size: 0.9rem; color: #fb923c; }
        .md-body p { margin-bottom: 0.75rem; color: #d4d4d4; }
        .md-body ul { margin: 0.5rem 0 0.75rem 0; padding-left: 1.25rem; list-style: none; }
        .md-body ul li { position: relative; padding-left: 0.5rem; margin-bottom: 0.4rem; color: #d4d4d4; line-height: 1.6; }
        .md-body ul li::before { content: '▸'; position: absolute; left: -1rem; color: #f97316; font-size: 0.7rem; top: 0.15rem; }
        .md-body ol { margin: 0.5rem 0 0.75rem 0; padding-left: 1.5rem; }
        .md-body ol li { margin-bottom: 0.4rem; color: #d4d4d4; line-height: 1.6; }
        .md-body ol li::marker { color: #f97316; font-weight: 600; }

        /* Code block styles */
        .md-body pre {
            background: #0d1117 !important;
            border-radius: 0.75rem !important;
            padding: 1rem !important;
            overflow-x: auto !important;
            margin: 1rem 0 !important;
            border: 1px solid #2a2a2a !important;
        }
        
        .md-body code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace !important;
            font-size: 0.8rem !important;
        }

            color: #f97316 !important;

            border-radius: 0.3rem !important;
        }
        
        .code-wrapper { position: relative; margin: 1rem 0; }
        .code-wrapper pre { background: #0d1117 !important; border-radius: 0.75rem !important; padding: 1rem !important; overflow-x: auto !important; margin: 0 !important; }
        
        .copy-btn {
            position: absolute; top: 8px; right: 8px; background: #2a2a2a; border: 1px solid #444;
            border-radius: 0.4rem; padding: 4px 10px; color: #aaa; cursor: pointer; font-size: 0.7rem;
            display: flex; align-items: center; gap: 5px; transition: all 0.2s; font-family: inherit; z-index: 10;
        }
        .copy-btn:hover { background: #f97316; color: #fff; border-color: #f97316; }
        .copy-btn.copied { background: #22c55e; color: #fff; border-color: #22c55e; }

        .hljs-keyword, .hljs-built_in { color: #ff7b72 !important; font-weight: 500 !important; }

        .hljs-string { color: #a5d6ff !important; }
        .hljs-number { color: #79c0ff !important; }
        .hljs-comment { color: #6a9955 !important; font-style: italic !important; }
        .hljs-variable, .hljs-params { color: #ffa657 !important; }
        .hljs-operator { color: #ff7b72 !important; }
        .hljs-tag, .hljs-name { color: #ff7b72 !important; }
        .hljs-attr, .hljs-attribute { color: #79c0ff !important; }
        .hljs-punctuation { color: #e6edf3 !important; }

        .message-doc-attachment { background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 16px; font-size: 0.7rem; margin-bottom: 6px; display: inline-flex; align-items: center; gap: 5px; color: #fff; font-weight: 500; }

        .attach-btn { padding: 0.3rem 0.8rem; background: #1a1a1a; border: 1px solid #333; border-radius: 0.5rem; color: #aaa; cursor: pointer; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 0.5rem; font-family: inherit; }

        .file-badge.hidden { display: none; }
        .input-row { display: flex; gap: 0.75rem; background: #1a1a1a; border-radius: 1rem; padding: 0.5rem 1rem; border: 1px solid #333; }

        #messageInput::placeholder { color: #555; }
        .send-btn { background: #f97316; border: none; border-radius: 0.5rem; padding: 0.4rem; color: #fff; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .send-btn:hover:not(:disabled) { background: #fb923c; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .input-hint { text-align: center; font-size: 0.6rem; color: #555; margin-top: 0.5rem; }

        .typing-dots { display: flex; gap: 4px; padding: 0.3rem; }
        .typing-dots span { width: 6px; height: 6px; background: #555; border-radius: 50%; animation: typing 1.4s infinite ease-in-out; }
        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.3; } 30% { transform: translateY(-7px); opacity: 1; } }
        .hidden { display: none !important; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
        
        @media (max-width: 768px) { .sidebar { width: 200px; } .sidebar.collapsed { width: 50px; } .message { max-width: 92%; } }
    </style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-spinner"><div class="spinner"></div><p>Processing...</p></div>
</div>

<div id="loginPage" class="login-page">
    <div class="login-card">
        <div class="login-icon"><i class="fas fa-brain"></i></div>
        <h1>DualMind</h1>
        <p class="login-sub">AI Assistant with Document Search</p>
        <div id="loginForm" class="login-form active">
            <input type="email" id="loginEmail" placeholder="Email" class="login-input">
            <input type="password" id="loginPassword" placeholder="Password" class="login-input">
            <button id="loginBtn" class="login-btn">Sign In</button>
            <p class="login-switch">New user? <a href="#" id="showRegister">Create account</a></p>
        </div>
        <div id="registerForm" class="login-form">
            <input type="text" id="registerName" placeholder="Full name" class="login-input">
            <input type="email" id="registerEmail" placeholder="Email" class="login-input">
            <input type="password" id="registerPassword" placeholder="Password (min 6)" class="login-input">
            <button id="registerBtn" class="login-btn">Create Account</button>
            <p class="login-switch">Already have an account? <a href="#" id="showLogin">Sign in</a></p>
        </div>
    </div>
</div>

<div id="chatPage" class="chat-page hidden">
    <div class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-chevron-left"></i></button>
        <div class="sidebar-header"><button id="newChatBtn" class="new-chat-btn"><i class="fas fa-plus"></i> <span>New chat</span></button></div>
        <div id="sessionList" class="session-list"></div>
        <div class="sidebar-footer"><div class="user-row"><i class="fas fa-user-circle"></i> <span id="userEmailSidebar"></span></div><button id="logoutSidebarBtn" class="logout-sidebar"><i class="fas fa-sign-out-alt"></i></button></div>
    </div>
    <div class="main-chat">
        <div class="chat-header">
            <div class="title-area"><h3 id="chatTitle">New conversation</h3><button id="renameChatBtn" class="rename-btn"><i class="fas fa-pen"></i></button></div>
            <div class="search-modes"><button class="mode-btn active" data-mode="hybrid"><i class="fas fa-link"></i> Hybrid</button><button class="mode-btn" data-mode="open"><i class="fas fa-globe"></i> Web</button></div>
        </div>
        <div id="messagesContainer" class="messages-container"><div class="welcome"><i class="fas fa-brain"></i><h3>Ready when you are</h3><p>Ask from your PDFs, the web, or both. Use Hybrid for the best experience.</p></div></div>
        <div class="input-section">
            <div class="attach-row"><button id="attachPdfBtn" class="attach-btn"><i class="fas fa-paperclip"></i> Attach PDF</button><input type="file" id="pdfFileInput" accept=".pdf" hidden><div id="fileBadge" class="file-badge hidden"></div></div>
            <div class="input-row"><textarea id="messageInput" placeholder="Ask a question..." rows="1"></textarea><button id="sendMsgBtn" class="send-btn"><i class="fas fa-paper-plane"></i></button></div>
            <div class="input-hint">Hybrid = PDF context + web search</div>
        </div>
    </div>
</div>

<script>
const API_URL = 'https://dualmind.onrender.com';

let token = null;
let user = null;
let currentSessionId = null;
let currentMode = 'hybrid';
let pendingFile = null;
let currentSessionDocuments = [];

let loginPage, chatPage, sessionListDiv, messagesDiv, messageInput, sendBtn;
let newChatBtn, renameBtn, logoutBtn, chatTitleSpan, attachBtn, fileInput, fileBadge;
let modeBtns, loadingOverlay, sidebar, sidebarToggle;

const WELCOME_HTML = `
    <div class="welcome">
        <i class="fas fa-brain"></i>
        <h3>Ready when you are</h3>
        <p>Ask from your PDFs, the web, or both. Use Hybrid for the best experience.</p>
    </div>
`;

function isCasualConversation(content) {
    if (!content) return false;
    // If content has ANY markdown indicators, it's NOT casual — must be rendered
    const hasMarkdown = content.includes('##') || content.includes('**') || 
                        content.includes('```') || content.includes('- ') ||
                        content.includes('1. ') || content.includes('> ');
    if (hasMarkdown) return false;
    
    const casualPatterns = [
        /^(hey|hi|hello|yo|sup|hiya|good morning|good afternoon|good evening)/i,
        /^(thanks|thank you|great|cool|awesome|nice|bye|goodbye)/i,
        /^how are you/i,
        /^(ok|okay|got it|understood)$/i
    ];
    // Only casual if short AND matches a greeting pattern
    if (content.length < 150) {
        return casualPatterns.some(pattern => pattern.test(content.toLowerCase().trim()));
    }
    return false;
}

function addCopyButtonsToCodeBlocks() {
    document.querySelectorAll('.md-body pre').forEach(pre => {
        if (pre.parentElement.classList.contains('code-wrapper')) return;
        const code = pre.querySelector('code');
        if (!code) return;
        const wrapper = document.createElement('div');
        wrapper.className = 'code-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
        copyBtn.onclick = async () => {
            await navigator.clipboard.writeText(code.textContent || '');
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            copyBtn.classList.add('copied');
            setTimeout(() => {
                copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                copyBtn.classList.remove('copied');
            }, 2000);
        };
        wrapper.appendChild(copyBtn);
    });
}

function cleanDualMindResponse(rawText) {
    if (!rawText || typeof rawText !== 'string') return '';
    
    // Preserve code blocks before cleaning
    const codeBlocks = [];
    let cleaned = rawText.replace(/```([\s\S]*?)```/g, (match) => {
        const placeholder = `__CODEBLOCK_${codeBlocks.length}__`;
        codeBlocks.push(match);
        return placeholder;
    });
    
    // Remove standalone numbers (chunk indices)
    cleaned = cleaned.replace(/^\d+\s*$/gm, '');
    cleaned = cleaned.replace(/^(\d+)\.\s*$/gm, '');
    
    // Remove internal source labels
    cleaned = cleaned.replace(/\[(Web Search|PDF Document|RAG|Hybrid)\]/gi, '');
    
    // Fix malformed headers — ensure space after # but don't strip them
    cleaned = cleaned.replace(/^##([^ #])/gm, '## $1');
    cleaned = cleaned.replace(/^#([^ #])/gm, '# $1');
    
    // Fix bullet points: only replace actual bullet chars (•), NOT * or - 
    // since those are valid markdown. Only replace bare • with -
    cleaned = cleaned.replace(/^•\s*/gm, '- ');
    
    // Clean up excessive newlines
    cleaned = cleaned.replace(/\n{4,}/g, '\n\n');
    
    // Fix [object Object]
    cleaned = cleaned.replace(/\[object Object\]/gi, '');
    
    // Restore code blocks
    codeBlocks.forEach((block, i) => {
        cleaned = cleaned.replace(`__CODEBLOCK_${i}__`, block);
    });
    
    return cleaned.trim();
}

function setupMarked() {
    if (typeof marked === 'undefined') return;
    marked.setOptions({
        gfm: true,
        breaks: true,
        highlight: function(code, lang) {
            if (lang && hljs.getLanguage(lang)) {
                try {
                    return hljs.highlight(code, { language: lang }).value;
                } catch(e) {}
            }
            try {
                return hljs.highlightAuto(code).value;
            } catch(e) {}
            return code;
        }
    });
}

async function renderMarkdown(text) {
    if (!text) return '<div class="md-body"></div>';
    try {
        if (typeof marked === 'undefined' || !marked.parse) {
            // Fallback if marked library failed to load
            return `<div class="md-body">${text.replace(/\n/g, '<br>')}</div>`;
        }
        let html;
        try {
            const result = marked.parse(text);
            // Handle both sync and async return from marked
            html = (result && typeof result.then === 'function') ? await result : result;
        } catch (parseErr) {
            console.error('Markdown parse error:', parseErr);
            html = text.replace(/\n/g, '<br>');
        }
        if (!html || typeof html !== 'string') {
            html = text.replace(/\n/g, '<br>');
        }
        return `<div class="md-body">${html}</div>`;
    } catch(e) {
        console.error('renderMarkdown fatal error:', e);
        // Ultimate fallback — never crash
        return `<div class="md-body">${(text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>')}</div>`;
    }
}

function buildSourceBadge(searchTypeUsed) {
    if (!searchTypeUsed || searchTypeUsed === 'Conversation') return '';
    let icon, label;
    const type = String(searchTypeUsed).toLowerCase();
    if (type.includes('pdf') || type.includes('document')) {
        icon = 'fa-file-pdf';
        label = '📄 PDF Document';
    } else if (type.includes('web') || type.includes('open')) {
        icon = 'fa-globe';
        label = '🌐 Web Search';
    } else {
        icon = 'fa-link';
        label = '🔗 Hybrid Search';
    }
    return `<div class="source-badge"><i class="fas ${icon}"></i> ${label}</div>`;
}

async function addMessageToChat(role, content, filename = null, searchTypeUsed = null) {
    if (!messagesDiv) return;
    const welcome = messagesDiv.querySelector('.welcome');
    if (welcome && role === 'user') welcome.remove();
    const messageDiv = document.createElement('div');
    let finalContent = content;
    if (role === 'assistant') finalContent = cleanDualMindResponse(content);
    messageDiv.className = `message ${role}`;
    let attachmentHTML = '';
    if (filename) {
        attachmentHTML = `<div class="message-doc-attachment"><i class="fas fa-file-pdf"></i> ${escapeHtml(filename)}</div>`;
    }
    if (role === 'user') {
        messageDiv.innerHTML = `
            <div class="message-avatar"><i class="fas fa-user"></i></div>
            <div class="message-content">
                ${attachmentHTML}
                <span>${escapeHtml(finalContent).replace(/\n/g, '<br>')}</span>
            </div>
        `;
    } else {
        const isCasual = isCasualConversation(finalContent);
        let renderedContent;
        if (isCasual) {
            renderedContent = `<div class="md-body">${escapeHtml(finalContent).replace(/\n/g, '<br>')}</div>`;
        } else {
            renderedContent = await renderMarkdown(finalContent);
            setTimeout(() => {
                addCopyButtonsToCodeBlocks();
                // Force highlight.js to run on all code blocks
                document.querySelectorAll('.md-body pre code').forEach(block => {
                    hljs.highlightElement(block);
                });
            }, 100);
        }
        const sourceBadge = buildSourceBadge(searchTypeUsed || currentMode);
        messageDiv.innerHTML = `
            <div class="message-avatar"><i class="fas fa-brain"></i></div>
            <div class="message-content">
                ${renderedContent}
                ${sourceBadge}
            </div>
        `;
    }
    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function sendMessage() {
    const text = messageInput?.value.trim();
    if (!text || !currentSessionId) return;
    const hasFile = !!pendingFile;
    const uploadedFilename = hasFile ? pendingFile.name : null;
    messageInput.value = '';
    messageInput.style.height = 'auto';
    await addMessageToChat('user', text, uploadedFilename);
    const messageCount = messagesDiv?.querySelectorAll('.message').length || 0;
    if (messageCount === 1) await autoTitle(currentSessionId, text);
    if (hasFile) {
        try {
            showTyping();
            await uploadFile(pendingFile, currentSessionId);
            pendingFile = null;
            if (fileBadge) fileBadge.classList.add('hidden');
            hideTyping();
        } catch (err) {
            hideTyping();
            await addMessageToChat('assistant', `❌ Upload failed: ${err.message}`);
            return;
        }
    }
    showTyping();
    if (sendBtn) sendBtn.disabled = true;
    try {
        const res = await fetch(`${API_URL}/chat/sessions/${currentSessionId}/messages`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ question: text, search_type: currentMode, include_sources: true, uploaded_document: uploadedFilename })
        });
        if (res.status === 401) { doLogout(); return; }
        const data = await res.json();
        hideTyping();
        if (res.ok) {
            let finalAnswer = data.answer || data.response || data.content || '';
            // Don't clean here — addMessageToChat already handles cleaning
            const searchSource = data.search_type_used || currentMode;
            await addMessageToChat('assistant', finalAnswer, null, searchSource);
        } else {
            await addMessageToChat('assistant', 'Sorry, something went wrong.');
        }
    } catch (err) {
        hideTyping();
        await addMessageToChat('assistant', 'Connection error.');
    } finally {
        if (sendBtn) sendBtn.disabled = false;
        messageInput?.focus();
    }
}

async function loadSession(sessionId) {
    if (sessionId === currentSessionId) return;
    currentSessionId = sessionId;
    try {
        await loadSessionDocuments(sessionId);
        const res = await fetch(`${API_URL}/chat/sessions/${sessionId}/messages`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) { doLogout(); return; }
        const data = await res.json();
        const sessionsRes = await fetch(`${API_URL}/chat/sessions`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const sessionsData = await sessionsRes.json();
        const sessionInfo = sessionsData.sessions?.find(s => s.id === sessionId);
        if (sessionInfo) chatTitleSpan.innerText = sessionInfo.title;
        if (messagesDiv) {
            if (!data.messages || data.messages.length === 0) {
                messagesDiv.innerHTML = WELCOME_HTML;
            } else {
                messagesDiv.innerHTML = '';
                for (const msg of data.messages) {
                    const searchType = msg.metadata?.search_type_used || null;
                    let cleanMessageContent = msg.content || msg.answer || msg.response || '';
                    if (msg.role === 'assistant') cleanMessageContent = cleanDualMindResponse(cleanMessageContent);
                    await addMessageToChat(msg.role, cleanMessageContent, msg.metadata?.filename, searchType);
                }
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }
        await loadSessions();
    } catch (err) { console.error(err); }
}

function toggleSidebar() {
    if (sidebar) {
        sidebar.classList.toggle('collapsed');
        localStorage.setItem('sidebar_collapsed', sidebar.classList.contains('collapsed'));
    }
}

document.addEventListener('DOMContentLoaded', () => {
    setupMarked();
    loginPage = document.getElementById('loginPage');
    chatPage = document.getElementById('chatPage');
    sessionListDiv = document.getElementById('sessionList');
    messagesDiv = document.getElementById('messagesContainer');
    messageInput = document.getElementById('messageInput');
    sendBtn = document.getElementById('sendMsgBtn');
    newChatBtn = document.getElementById('newChatBtn');
    renameBtn = document.getElementById('renameChatBtn');
    logoutBtn = document.getElementById('logoutSidebarBtn');
    chatTitleSpan = document.getElementById('chatTitle');
    attachBtn = document.getElementById('attachPdfBtn');
    fileInput = document.getElementById('pdfFileInput');
    fileBadge = document.getElementById('fileBadge');
    modeBtns = document.querySelectorAll('.mode-btn');
    loadingOverlay = document.getElementById('loadingOverlay');
    sidebar = document.getElementById('sidebar');
    sidebarToggle = document.getElementById('sidebarToggle');
    const savedSidebarState = localStorage.getItem('sidebar_collapsed');
    if (savedSidebarState === 'true' && sidebar) sidebar.classList.add('collapsed');
    setupEventListeners();
    checkAuth();
});

function showLoading() { if (loadingOverlay) loadingOverlay.classList.remove('hidden'); }
function hideLoading() { if (loadingOverlay) loadingOverlay.classList.add('hidden'); }

function setupEventListeners() {
    document.getElementById('loginBtn')?.addEventListener('click', async () => { showLoading(); await doLogin(); hideLoading(); });
    document.getElementById('registerBtn')?.addEventListener('click', async () => { showLoading(); await doRegister(); hideLoading(); });
    document.getElementById('showRegister')?.addEventListener('click', (e) => { e.preventDefault(); toggleForms(true); });
    document.getElementById('showLogin')?.addEventListener('click', (e) => { e.preventDefault(); toggleForms(false); });
    sendBtn?.addEventListener('click', sendMessage);
    messageInput?.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    messageInput?.addEventListener('input', () => {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    });
    newChatBtn?.addEventListener('click', createNewSession);
    renameBtn?.addEventListener('click', renameSession);
    logoutBtn?.addEventListener('click', async () => { showLoading(); doLogout(); hideLoading(); });
    attachBtn?.addEventListener('click', () => fileInput?.click());
    fileInput?.addEventListener('change', onFileSelect);
    sidebarToggle?.addEventListener('click', toggleSidebar);
    modeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            modeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.dataset.mode;
        });
    });
}

async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { alert('Enter email and password'); hideLoading(); return; }
    try {
        const res = await fetch(`${API_URL}/auth/signin`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
            token = data.access_token;
            user = { id: data.user_id, email: data.email };
            localStorage.setItem('dm_token', token);
            localStorage.setItem('dm_user', JSON.stringify(user));
            showChatUI();
            await loadSessions();
        } else { alert('Login failed: ' + (data.detail || 'Error')); }
    } catch (err) { alert('Connection error'); }
}

async function doRegister() {
    const name = document.getElementById('registerName').value;
    const email = document.getElementById('registerEmail').value.trim();
    const password = document.getElementById('registerPassword').value;
    if (!email || !password) { alert('Fill all fields'); return; }
    if (password.length < 6) { alert('Password min 6 chars'); return; }
    try {
        const res = await fetch(`${API_URL}/auth/signup`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, full_name: name })
        });
        if (res.ok) {
            alert('Signup successful! Please login.');
            toggleForms(false);
            document.getElementById('loginEmail').value = email;
        } else {
            const data = await res.json();
            alert('Signup failed: ' + (data.detail || 'Error'));
        }
    } catch (err) { alert('Connection error'); }
}

function doLogout() {
    token = null; user = null; currentSessionId = null; currentSessionDocuments = [];
    localStorage.clear();
    showLoginUI();
}

function checkAuth() {
    const savedToken = localStorage.getItem('dm_token');
    const savedUser = localStorage.getItem('dm_user');
    if (savedToken && savedUser) {
        token = savedToken;
        user = JSON.parse(savedUser);
        showChatUI();
        loadSessions();
    } else { showLoginUI(); }
}

function showLoginUI() {
    loginPage.classList.remove('hidden');
    chatPage.classList.add('hidden');
}

function showChatUI() {
    loginPage.classList.add('hidden');
    chatPage.classList.remove('hidden');
    document.getElementById('userEmailSidebar').innerText = user?.email?.split('@')[0] || 'User';
}

function toggleForms(showRegister) {
    document.getElementById('loginForm').classList.toggle('active', !showRegister);
    document.getElementById('registerForm').classList.toggle('active', showRegister);
}

async function loadSessions() {
    if (!sessionListDiv) return;
    sessionListDiv.innerHTML = '<div class="loading-text">Loading...</div>';
    try {
        const res = await fetch(`${API_URL}/chat/sessions`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.status === 401) { doLogout(); return; }
        const data = await res.json();
        if (res.ok && data.sessions && data.sessions.length > 0) {
            renderSessionList(data.sessions);
            if (!currentSessionId && data.sessions[0]) await loadSession(data.sessions[0].id);
        } else {
            sessionListDiv.innerHTML = '<div class="loading-text">No conversations</div>';
            if (!currentSessionId) await createNewSession();
        }
    } catch (err) {
        sessionListDiv.innerHTML = '<div class="loading-text">Failed to load</div>';
    }
}

function renderSessionList(sessions) {
    if (!sessionListDiv) return;
    sessionListDiv.innerHTML = '';
    for (const s of sessions) {
        const div = document.createElement('div');
        div.className = `session-item ${currentSessionId === s.id ? 'active' : ''}`;
        div.dataset.id = s.id;
        div.innerHTML = `<span class="session-title">${escapeHtml(s.title)}</span><button class="delete-session" data-id="${s.id}"><i class="fas fa-times"></i></button>`;
        div.addEventListener('click', (e) => { if (!e.target.closest('.delete-session')) loadSession(s.id); });
        div.querySelector('.delete-session')?.addEventListener('click', (e) => { e.stopPropagation(); deleteSession(s.id); });
        sessionListDiv.appendChild(div);
    }
}

async function createNewSession() {
    try {
        const res = await fetch(`${API_URL}/chat/sessions`, {
            method: 'POST', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        });
        if (res.status === 401) { doLogout(); return; }
        const data = await res.json();
        if (res.ok && data.session) {
            currentSessionId = data.session.id;
            currentSessionDocuments = [];
            chatTitleSpan.innerText = 'New conversation';
            clearMessages();
            await loadSessions();
        }
    } catch (err) { console.error(err); }
}

async function loadSessionDocuments(sessionId) {
    try {
        const res = await fetch(`${API_URL}/chat/sessions/${sessionId}/documents`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) { const data = await res.json(); currentSessionDocuments = data.documents || []; }
    } catch (err) { currentSessionDocuments = []; }
}

async function deleteSession(sessionId) {
    if (!confirm('Delete this conversation?')) return;
    try {
        await fetch(`${API_URL}/chat/sessions/${sessionId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
        if (currentSessionId === sessionId) {
            currentSessionId = null;
            currentSessionDocuments = [];
            const sessionsRes = await fetch(`${API_URL}/chat/sessions`, { headers: { 'Authorization': `Bearer ${token}` } });
            const sessionsData = await sessionsRes.json();
            if (sessionsData.sessions && sessionsData.sessions.length > 0) await loadSession(sessionsData.sessions[0].id);
            else await createNewSession();
        }
        await loadSessions();
    } catch (err) { console.error(err); }
}

function clearMessages() {
    if (!messagesDiv) return;
    messagesDiv.innerHTML = WELCOME_HTML;
}

function showTyping() {
    if (!messagesDiv) return;
    hideTyping();
    const typing = document.createElement('div');
    typing.className = 'message assistant';
    typing.id = 'typingIndicator';
    typing.innerHTML = `<div class="message-avatar"><i class="fas fa-brain"></i></div><div class="message-content"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    messagesDiv.appendChild(typing);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

function onFileSelect(e) {
    const file = e.target.files[0];
    if (!file || !file.name.endsWith('.pdf')) { alert('Please select a PDF file'); return; }
    pendingFile = file;
    if (fileBadge) {
        fileBadge.innerHTML = `<i class="fas fa-file-pdf"></i> ${escapeHtml(file.name)} <i class="fas fa-check-circle"></i>`;
        fileBadge.classList.remove('hidden');
    }
}

async function uploadFile(file, sessionId) {
    const fd = new FormData();
    fd.append('file', file);
    const res = await fetch(`${API_URL}/upload?session_id=${sessionId}`, {
        method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: fd
    });
    if (res.status === 401) { doLogout(); throw new Error('Unauthorized'); }
    if (!res.ok) { const error = await res.json(); throw new Error(error.detail || 'Upload failed'); }
    return await res.json();
}

async function autoTitle(sessionId, firstMsg) {
    const short = firstMsg.length > 30 ? firstMsg.substring(0, 30) + '...' : firstMsg;
    try {
        await fetch(`${API_URL}/chat/sessions/${sessionId}?title=${encodeURIComponent(short)}`, {
            method: 'PUT', headers: { 'Authorization': `Bearer ${token}` }
        });
        chatTitleSpan.innerText = short;
        await loadSessions();
    } catch (err) { console.error(err); }
}

async function renameSession() {
    const newName = prompt('Rename conversation:', chatTitleSpan?.innerText);
    if (!newName || newName === chatTitleSpan?.innerText || !currentSessionId) return;
    try {
        await fetch(`${API_URL}/chat/sessions/${currentSessionId}?title=${encodeURIComponent(newName)}`, {
            method: 'PUT', headers: { 'Authorization': `Bearer ${token}` }
        });
        chatTitleSpan.innerText = newName;
        await loadSessions();
    } catch (err) { console.error(err); }
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
