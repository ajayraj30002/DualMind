name: DualMind CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: dualmind-backend

jobs:
  # JOB 1: Run tests
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx
    
    - name: Create test directories
      run: |
        cd backend
        mkdir -p uploads chroma_db
    
    - name: Run tests
      run: |
        cd backend
        pytest tests/ -v --cov=app --cov-report=xml --ignore=rag/
      continue-on-error: true
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: backend/coverage.xml
      if: always()

  # JOB 2: Build and push Docker image
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # JOB 3: Deploy to Render
  deploy-render:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Trigger Render Deployment
      run: |
        curl -X POST \
          https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }} \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json"
    
    - name: Wait for deployment
      run: sleep 30
    
    - name: Verify deployment
      run: |
        BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}/health"
        for i in {1..10}; do
          echo "Checking deployment (attempt $i/10)..."
          if curl -f -s $BACKEND_URL | grep -q "ok"; then
            echo "✅ Deployment successful!"
            exit 0
          fi
          sleep 10
        done
        echo "❌ Deployment verification failed"
        exit 1
